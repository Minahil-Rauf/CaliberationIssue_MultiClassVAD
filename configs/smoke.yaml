# Quick end-to-end test on synthetic audio. No downloads, a few minutes on a CPU.
# Outputs go to data_smoke/ and outputs_smoke/. NEVER use them in the paper.
extends: default.yaml
smoke: true

paths:
  data_dir: data_smoke
  output_dir: outputs_smoke

mixing:
  n_clips: {train: 48, val: 12, test_in: 12, test_shift: 12}

training:
  losses: [ce, focal]
  seeds: [0]
  batch_size: 8
  max_epochs: 2

evaluation:
  bootstrap_resamples: 50
